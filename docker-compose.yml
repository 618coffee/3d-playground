services:
  agent-api:
    build:
      context: ./backend/agent-api
    environment:
      HOST: 0.0.0.0
      AGENT_API_PORT: 8787
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ACCESS_TOKEN: ${LLM_ACCESS_TOKEN:-}
      LLM_API_VERSION: ${LLM_API_VERSION:-2024-05-01-preview}
      LLM_AUTH_HEADER: ${LLM_AUTH_HEADER:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
    ports:
      - "8787:8787"
